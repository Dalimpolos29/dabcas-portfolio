<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Stylised payslip: a payroll run with a loan instalment line claimed atomically before deductions apply.">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#05100E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aquaFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
      .sans { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
      .lbl  { fill: #7E9A94; font-size: 30px; letter-spacing: 0.04em; }
      .amt  { fill: #E6F2EE; font-size: 30px; text-anchor: end; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#05100E"/>
  <ellipse cx="220" cy="90" rx="620" ry="360" fill="url(#glow)"/>

  <!-- header -->
  <text class="mono" x="120" y="140" fill="#0D9488" font-size="24" letter-spacing="0.22em">PAYROLL RUN</text>
  <text class="mono" x="1480" y="140" fill="#0D9488" font-size="24" letter-spacing="0.22em" text-anchor="end">STATUS: APPROVED</text>
  <line x1="120" y1="176" x2="1480" y2="176" stroke="#17322C" stroke-width="2"/>

  <!-- three-stage workflow marker -->
  <text class="mono" x="120" y="238" fill="#7E9A94" font-size="24" letter-spacing="0.12em">
    ENCODER<tspan fill="#17322C">  →  </tspan>AUDITOR<tspan fill="#17322C">  →  </tspan><tspan fill="#2DD4BF">APPROVER</tspan>
  </text>

  <!-- ledger rows -->
  <g>
    <text class="mono lbl" x="120" y="380">BASIC PAY</text>
    <text class="mono amt" x="1480" y="380">18,200.00</text>
    <line x1="120" y1="410" x2="1480" y2="410" stroke="#17322C"/>

    <text class="mono lbl" x="120" y="472">OVERTIME · NIGHT DIFF</text>
    <text class="mono amt" x="1480" y="472">2,640.00</text>
    <line x1="120" y1="502" x2="1480" y2="502" stroke="#17322C"/>

    <!-- the line the race condition used to double-apply -->
    <rect x="104" y="524" width="1392" height="72" fill="url(#aquaFade)"/>
    <rect x="104" y="524" width="4" height="72" fill="#2DD4BF"/>
    <text class="mono lbl" x="120" y="564" fill="#2DD4BF">LOAN INSTALMENT</text>
    <text class="mono amt" x="1480" y="564" fill="#2DD4BF">−1,500.00</text>
    <text class="mono" x="120" y="596" fill="#0D9488" font-size="19" letter-spacing="0.14em">CLAIMED ONCE · AUDITED → APPROVED</text>
    <line x1="120" y1="620" x2="1480" y2="620" stroke="#17322C"/>

    <text class="mono lbl" x="120" y="682">SSS · PHILHEALTH · PAG-IBIG</text>
    <text class="mono amt" x="1480" y="682">−1,187.50</text>

    <!-- ledger double rule -->
    <line x1="120" y1="716" x2="1480" y2="716" stroke="#17322C" stroke-width="2"/>
    <line x1="120" y1="724" x2="1480" y2="724" stroke="#17322C" stroke-width="2"/>
  </g>

  <!-- total -->
  <text class="sans" x="120" y="806" fill="#E6F2EE" font-size="38" font-weight="700" letter-spacing="-0.01em">Net pay</text>
  <text class="mono" x="1480" y="806" fill="#7FFFD4" font-size="44" font-weight="700" text-anchor="end">18,152.50</text>
  <text class="mono" x="120" y="852" fill="#7E9A94" font-size="20" letter-spacing="0.12em">DOLE 2025 COMPLIANT · RECONCILED TO THE CENTAVO</text>
</svg>
